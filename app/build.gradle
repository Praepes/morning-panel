plugins {
    id 'com.android.application'
}

android {
    namespace 'com.morningpanel.app'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'com.xperiatouch.clock'
        minSdk 26
        targetSdk 28
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'com.morningpanel.app.ClockRenderingChecks'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Instrumentation installs and removes only a disposable application package.
    testBuildType 'clockChecks'
    buildTypes {
        clockChecks {
            initWith debug
            applicationIdSuffix '.clockchecks'
            matchingFallbacks = ['debug']
        }
    }
}
